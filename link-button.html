<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Quick Links</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    a {
      display: block;
      width: 80px;
      height: 80px;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    a:hover {
      opacity: 0.85;
      transform: scale(1.06);
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- 第一張圖片：GitHub -->
  <a href="https://github.com/" target="_blank" rel="noopener noreferrer" title="前往 GitHub">
    <img src="./github.png" alt="GitHub">
  </a>

  <!-- 第二張圖片：F1 Live -->
  <a href="https://flive.cc.cd/" target="_blank" rel="noopener noreferrer" title="前往 F1 Live">
    <img src="./f1 live.png" alt="F1 Live">
  </a>

  <!-- 第三張圖片：AO3 -->
  <a href="https://archiveofourown.org/" target="_blank" rel="noopener noreferrer" title="前往 AO3">
    <img src="./ao3.png" alt="AO3">
  </a>

  <!-- 第四張圖片：請替換以下 4 個設定值 -->
  <a href="https://gemini.google.com/app?utm_source=app_launcher&utm_medium=owned&utm_campaign=base_all" target="_blank" rel="noopener noreferrer" title="前往Gemini">
    <img src="./gemini.png" alt="Gemini">
  </a>

  <!-- 第五張圖片：請替換以下 5個設定值 -->
  <a href="https://app.notion.com/p/Budget-Finance-Tracker-694e16b3fbe8825b9c5e013e70bb773c" target="_blank" rel="noopener noreferrer" title="前往finance">
    <img src="./finance.png" alt="finance">
  </a>

</body>
</html>
