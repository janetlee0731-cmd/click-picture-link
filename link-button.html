<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Image Link</title>
  <style>
    /* 1. 清除預設邊距並隱藏捲軸，確保背景透明 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* 2. 讓超連結填滿整個視窗 */
    a {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }

    /* 3. 圖片自適應縮放，消除底部 4px 預設空隙並加上懸停回饋 */
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 若希望圖片完整顯示不被裁切，可改為 contain */
      border-radius: 8px; /* 圓角幅度，不需要可設為 0 */
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    img:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>

  <!-- 將 href 替換為目標網頁，src 替換為圖片路徑或網址 -->
  <a href="https://example.com" target="_blank" rel="noopener noreferrer">
    <img src="./banner.png" alt="點擊前往網頁">
  </a>

</body>
</html>
