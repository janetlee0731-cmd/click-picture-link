<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Shortcut</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      /* 讓小圖示在區塊內水平置中、垂直置中；若要靠左對齊，請將 center 改為 flex-start */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 直接限制超連結與圖片的固定像素大小（可依喜好調整為 36px ~ 64px） */
    a {
      display: block;
      width: 48px;
      height: 48px;
      text-decoration: none;
      border-radius: 50%; /* 圓形圖示可設為 50%，方形圖示建議改為 8px */
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.85;
      transform: scale(1.06);
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- 已設定跳轉至 GitHub 首頁，請確認 src 為你 Repo 內的實際圖片檔名 -->
  <a href="https://github.com/" target="_blank" rel="noopener noreferrer" title="前往 GitHub">
    <img src="./github.png" alt="GitHub">
  </a>

</body>
</html>
